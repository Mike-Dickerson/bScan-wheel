name: Check for newer Open3D release

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream Open3D version and Embree compatibility
        run: bash scripts/check_upstream.sh
